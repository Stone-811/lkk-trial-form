<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>體驗課電子表單（試用版）</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
:root{--navy:#2C4258;--navy2:#3d5873;--orange:#E07A2E;--ink:#1f2a33;--muted:#6b7680;--line:#c9d0d6;--bg:#e9ecef;--paper:#fff;--miss:#c0392b;--soft:#f4f2ee}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;font-size:17px;line-height:1.55}
.topbar{position:sticky;top:0;z-index:20;background:var(--navy);color:#fff;padding:10px 18px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.topbar b{font-size:18px;letter-spacing:.5px}
.topbar .tag{background:#fff;color:var(--navy);border-radius:4px;padding:1px 8px;font-size:13px;font-weight:700}
.topbar .sp{flex:1}
.wrap{max-width:860px;margin:0 auto;padding:22px 14px 140px}
.page{background:var(--paper);box-shadow:0 2px 10px rgba(0,0,0,.12);margin:0 0 26px;padding:34px 42px 38px;position:relative}
.page.off{display:none}
.skipnote{max-width:860px;margin:-10px auto 26px;padding:12px 18px;background:#fff8ef;border:1px dashed var(--orange);border-radius:6px;color:#8a4a12;font-size:15px}
.ph{display:flex;align-items:flex-end;justify-content:space-between;border-bottom:3px solid var(--navy);padding-bottom:10px;margin-bottom:18px}
.ph .brand{font-weight:700;color:var(--navy);font-size:15px;letter-spacing:1px}
.ph h1{margin:0;font-size:26px;color:var(--navy);letter-spacing:3px}
.ph .paper{font-size:12.5px;color:var(--muted)}
.sec{margin:22px 0 8px;padding:5px 12px;background:var(--soft);border-left:5px solid var(--navy);font-weight:700;font-size:17px;display:flex;align-items:center;gap:10px}
.who{font-size:12.5px;font-weight:700;border-radius:20px;padding:1px 10px;white-space:nowrap}
.who.s{border:1.5px solid var(--navy);color:var(--navy);background:#fff}
.who.k{background:var(--navy);color:#fff}
.grid{display:flex;flex-wrap:wrap;gap:4px 22px}
.f{flex:1 1 100%;padding:7px 0;min-width:0}
.f.half{flex:1 1 calc(50% - 22px)}
.f.third{flex:1 1 calc(33.3% - 22px)}
.f.off{display:none}
.f .lb{font-size:16px;margin-bottom:4px}
.f .lb .req{color:var(--orange);font-weight:700;margin-left:2px}
.f .lb .cell{font-size:11.5px;color:#9aa3ab;margin-left:6px}
.f.q-sub{padding-left:26px}
.f.q-main .lb{font-weight:700}
.f.missing .lb{color:var(--miss)}
.f.missing .line,.f.missing .opts,.f.missing canvas{outline:2px solid var(--miss);outline-offset:2px}
.f.flash{animation:fl 1.2s}
@keyframes fl{0%{background:#fff3cd}100%{background:transparent}}
input.line,textarea.line,select.line{width:100%;border:none;border-bottom:1.5px solid var(--ink);font:inherit;font-size:17px;padding:6px 2px;background:transparent;color:var(--ink);border-radius:0}
textarea.line{border:1.5px solid var(--line);border-radius:4px;min-height:96px;padding:8px}
input.line:focus,textarea.line:focus{outline:none;border-color:var(--navy);background:#f6f9fc}
.unitrow{display:flex;align-items:center;gap:8px}.unitrow input{min-width:0;flex:1}
.unitrow .u{color:var(--muted);font-size:15px;white-space:nowrap}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opts.col{flex-direction:column;align-items:flex-start}
.opt{white-space:nowrap;display:inline-flex;align-items:center;gap:8px;padding:7px 14px 7px 10px;border:1.5px solid var(--line);border-radius:6px;cursor:pointer;user-select:none;background:#fff;min-height:44px;font-size:16px}
.opt .bx{width:20px;height:20px;border:2px solid var(--ink);display:inline-flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;flex:none}
.opt.round .bx{border-radius:50%}
.opt.on{border-color:var(--navy);background:#eef3f8}
.opt.on .bx{background:var(--navy);border-color:var(--navy);color:#fff}
.opt.on .bx::after{content:"✓"}
.note{font-size:15.5px;margin:8px 0;color:var(--ink)}
.note.pre{white-space:pre-line;background:var(--soft);padding:12px 16px;border-radius:6px}
.note.warn{color:#8a4a12;font-weight:700}
.note.hint{color:var(--muted);font-size:14.5px}
.note.quote{border:1.5px solid var(--line);padding:14px 18px;border-radius:6px;background:#fbfbfa;font-size:15.5px}
.note.off{display:none}
.age{font-size:14px;color:var(--muted);margin-top:4px}
.sug{font-size:14px;color:var(--navy);margin-top:6px;background:#eef3f8;padding:6px 10px;border-radius:4px;display:inline-block}
.sigbox{position:relative}
.sigbox canvas{width:100%;height:150px;border:1.5px dashed var(--navy2);border-radius:6px;background:#fff;touch-action:none;display:block}
.sigbox .ph2{position:absolute;left:12px;top:10px;color:#b4bcc3;font-size:14px;pointer-events:none}
.sigbox .clr{position:absolute;right:8px;top:8px}
.btn{font:inherit;font-size:15px;border-radius:6px;padding:8px 16px;cursor:pointer;border:1.5px solid var(--navy);background:#fff;color:var(--navy);min-height:42px}
.btn.pri{background:var(--navy);color:#fff}
.btn.ghost{border-color:#fff;color:#fff;background:transparent}
.btn.sm{font-size:13.5px;padding:4px 10px;min-height:32px}
.btn:disabled{opacity:.5;cursor:default}
.dobrow{display:grid;grid-template-columns:1fr auto 1fr 1.4fr;gap:14px;align-items:end}.dobrow .sub{font-size:13.5px;color:var(--muted)}.dobrow .or{padding-bottom:10px;color:var(--muted)}.dobrow select.line{font-size:16px}
@media (max-width:640px){.dobrow{grid-template-columns:1fr 1fr}.dobrow .or{display:none}}
.mirror{border-bottom:1.5px solid var(--ink);padding:6px 2px;min-height:38px}
/* 人形圖 */
.parts{display:flex;gap:26px;align-items:flex-start;flex-wrap:wrap}
.parts svg{width:230px;flex:none}
.parts svg .body{fill:#eef0f2;stroke:#8d98a3;stroke-width:1.5}
.parts svg .hit{fill:rgba(44,66,88,.0);stroke:var(--navy2);stroke-width:1.4;stroke-dasharray:3 2;cursor:pointer}
.parts svg .hit.on{fill:rgba(224,122,46,.75);stroke:var(--orange);stroke-dasharray:none}
.parts svg text{font-size:10px;fill:var(--muted)}
.plist{flex:1;min-width:250px}
.plist table{border-collapse:collapse;width:100%}
.plist td{padding:3px 4px;vertical-align:middle}
.plist td.n{font-weight:700;width:46px}
.plist .opt{min-height:38px;padding:4px 10px 4px 8px;font-size:15px}
.rep .row{display:grid;grid-template-columns:130px 1fr 130px 40px;gap:10px;align-items:end;margin-bottom:6px}
.rep .row select{font:inherit;font-size:16px;padding:6px;border:none;border-bottom:1.5px solid var(--ink);background:transparent}
.bottombar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:#fff;border-top:1px solid var(--line);box-shadow:0 -2px 10px rgba(0,0,0,.08);padding:10px 18px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;justify-content:center}
.bottombar .cnt{font-size:15px}
.bottombar .cnt b{color:var(--orange)}
.modal{position:fixed;inset:0;background:rgba(20,30,40,.5);z-index:50;display:none;align-items:center;justify-content:center;padding:20px}
.modal.on{display:flex}
.modal .box{background:#fff;border-radius:10px;max-width:640px;width:100%;max-height:85vh;overflow:auto;padding:24px 26px}
.modal h3{margin:0 0 10px;color:var(--navy)}
.modal ul{padding-left:20px;margin:8px 0}
.steps li{margin:6px 0}
.steps .ok{color:#1e7a46;font-weight:700}
.steps .bad{color:var(--miss);font-weight:700}
.steps .run{color:var(--navy);font-weight:700}
.printing .noprint{display:none!important}
.printing .f .lb .cell{display:none}
.printing .page{box-shadow:none;margin:0}
@media (max-width:640px){.page{padding:22px 16px}.f.half,.f.third{flex-basis:100%}.rep .row{grid-template-columns:1fr 1fr}.ph h1{font-size:21px}}
</style>
</head>
<body>
<div class="topbar">
  <b>練健康｜體驗課電子表單</b><span class="tag">試用版 v4</span>
  <span class="sp"></span>
  <span style="font-size:13.5px;opacity:.85">送出會寫進「體驗課總表（試用）」，請勿填真實學員資料</span>
</div>
<div class="wrap" id="wrap"></div>
<div class="bottombar noprint">
  <span class="cnt" id="cnt"></span>
  <button class="btn" id="bNext">跳到下一個未填</button>
  <button class="btn" id="bDemo">填入測試資料</button>
  <button class="btn" id="bReset">清空</button>
  <button class="btn pri" id="bSubmit">送出</button>
</div>
<div class="modal" id="modal"><div class="box" id="mbox"></div></div>

<script>
const SPEC = {"pages": [{"id": "p0", "title": "個人資料蒐集告知與同意", "blocks": [{"type": "head", "text": "開始填寫前請先閱讀", "who": "學員"}, {"type": "note", "text": "【試用版】以下是說明文字要寫的重點，正式文字待法務／人資確認後才會放上：", "cls": "warn"}, {"type": "note", "text": "1. 蒐集單位：練健康所屬公司（用哪一家公司名義待確認）\n2. 蒐集目的：體驗課評估、運動安全篩檢、安排課表\n3. 蒐集哪些資料：基本資料、聯絡方式、健康與病史、身體量測結果、簽名\n4. 誰會看到：負責教練、該店店長、教育訓練部（權限鎖定）\n5. 保存多久、存在哪裡（Google Sheet／Drive，公司帳號）\n6. 您可以要求查詢、更正、停止使用或刪除，以及聯絡窗口\n7. 不提供資料的影響：教練無法確認運動安全，可能無法安排課程\n8. 健康相關資料的蒐集條件（待法務確認）", "cls": "pre"}, {"id": "S00", "label": "我已閱讀上述個人資料蒐集說明，並同意練健康蒐集與使用我的資料", "type": "check", "req": true}]}, {"id": "p1", "title": "體適能運動諮詢單", "paper": "紙本第 1 頁", "blocks": [{"type": "head", "text": "體驗課資訊", "who": "教練"}, {"id": "K01", "label": "門市", "type": "radio", "opts": ["南京", "西門", "七張", "松江"], "req": true, "cell": "（存檔資料夾用）"}, {"id": "K02", "label": "負責教練", "type": "text", "req": true, "cell": "C7", "w": "half"}, {"id": "K03", "label": "填寫日期", "type": "date", "req": true, "today": true, "w": "half"}, {"type": "head", "text": "基本資料 Personal Info", "who": "學員"}, {"id": "S01", "label": "姓名", "type": "text", "req": true, "cell": "C8", "w": "half"}, {"id": "S02", "label": "性別", "type": "radio", "opts": ["女", "男"], "req": true, "cell": "C9", "w": "half"}, {"id": "S03", "label": "年齡／出生年", "type": "dob", "req": true, "cell": "C10／C11"}, {"id": "S07", "label": "職業", "type": "text", "w": "half"}, {"id": "S04", "label": "聯絡電話", "type": "tel", "req": true, "w": "half"}, {"id": "S05", "label": "Email", "type": "email", "w": "half"}, {"id": "S06", "label": "聯絡地址", "type": "text"}, {"id": "S08", "label": "目前運動習慣", "type": "radio", "req": true, "cell": "C54", "col": true, "opts": ["(一)完全沒有運動", "(二)有想運動，還沒開始", "(三)偶爾想到會運動一下，但每週運動不超過 150 分鐘", "(四)每週運動超過三次，但還持續不到六個月", "(五)每週保持運動至少三次，且運動習慣維持超過六個月以上"]}, {"type": "head", "text": "身體狀況評估", "who": "教練"}, {"id": "K04", "label": "安靜心率", "type": "number", "unit": "bpm", "req": true, "cell": "C21", "w": "third"}, {"id": "K05", "label": "收縮壓", "type": "number", "unit": "mmHg", "req": true, "cell": "C19", "w": "third"}, {"id": "K06", "label": "舒張壓", "type": "number", "unit": "mmHg", "req": true, "cell": "C20", "w": "third"}, {"id": "K07", "label": "身高", "type": "number", "unit": "cm", "req": true, "cell": "C13", "w": "third"}, {"id": "K08", "label": "體重", "type": "number", "unit": "kg", "req": true, "cell": "C14", "w": "third"}, {"id": "K09", "label": "SMI", "type": "number", "unit": "kg/m²", "req": true, "cell": "C18", "w": "third"}, {"id": "K10", "label": "左手握力", "type": "number", "unit": "kg", "req": true, "cell": "C17", "w": "third"}, {"id": "K11", "label": "右手握力", "type": "number", "unit": "kg", "req": true, "cell": "C16", "w": "third"}, {"id": "K12", "label": "五次坐到站", "type": "number", "unit": "秒", "req": true, "cell": "C30", "w": "third"}, {"id": "K13", "label": "4 公尺行走", "type": "number", "unit": "秒", "req": true, "cell": "C31", "w": "third"}, {"id": "K14", "label": "（已停用）超過 4 秒", "type": "check", "retired": true}, {"id": "K15", "label": "三十秒坐到站", "type": "number", "unit": "次", "w": "third"}, {"type": "head", "text": "動作評估", "who": "教練"}, {"id": "K16", "label": "單腳站｜左", "type": "secs", "w": "half"}, {"id": "K16b", "label": "（左腳無法）右腳墊腳站", "type": "secs", "w": "half", "show": {"if": "K16", "eq": "無法"}}, {"id": "K17", "label": "單腳站｜右", "type": "secs", "w": "half"}, {"id": "K17b", "label": "（右腳無法）左腳墊腳站", "type": "secs", "w": "half", "show": {"if": "K17", "eq": "無法"}}, {"id": "K18", "label": "一字型站｜左腳在前", "type": "secs", "w": "half"}, {"id": "K19", "label": "一字型站｜右腳在前", "type": "secs", "w": "half"}, {"id": "K20", "label": "單腳椅子起立｜左", "type": "radio", "opts": ["完成", "無法"], "w": "half"}, {"id": "K21", "label": "單腳椅子起立｜右", "type": "radio", "opts": ["完成", "無法"], "w": "half"}, {"id": "K22", "label": "靠牆站：後腦勺靠得到牆嗎？", "type": "radio", "opts": ["靠得到", "靠不到"], "req": true, "cell": "C34（靠得到＝0；靠不到＝骨折 F2）", "w": "half"}, {"type": "head", "text": "特殊疾病與病史", "who": "學員"}, {"id": "S09", "label": "現有特殊疾病（可複選）", "type": "multi", "req": true, "cell": "C55／C56", "none": "以上皆無", "opts": ["心血管疾病", "代謝疾病", "肺部疾病", "消化系統疾病", "帕金森氏症", "失智症", "小腦疾病", "前庭疾病／眩暈症", "視力障礙", "其他神經系統疾病", "以上皆無"]}, {"id": "S10", "label": "其他疾病：請寫疾病名稱", "type": "text"}, {"id": "S11", "label": "過去病史", "type": "text"}, {"id": "S12", "label": "目前是否長期（3 個月以上）服用或注射類固醇？", "type": "radio", "opts": ["是", "否"], "req": true, "cell": "C44"}, {"id": "S13", "label": "醫師是否說過您的脊椎有壓迫性骨折？（例如跌倒、搬東西或咳嗽後脊椎骨折）", "type": "radio", "opts": ["有", "沒有", "不確定"], "req": true, "cell": "C43"}, {"id": "S14", "label": "過去 12 個月內沒有手術", "type": "check", "cell": "C57"}, {"id": "S15", "label": "治療／手術史（可新增多筆）", "type": "repeat", "show": {"if": "S14", "ne": "是"}, "req": true, "cell": "C57"}, {"id": "S16", "label": "有做過骨密度檢查嗎？", "type": "radio", "opts": ["有", "沒做過"], "req": true}, {"id": "S17", "label": "骨密度 T score", "type": "number", "neg": true, "w": "half", "cell": "C32", "show": {"if": "S16", "eq": "有"}}, {"id": "S18", "label": "骨密度 Z score", "type": "number", "neg": true, "w": "half", "cell": "C33", "show": {"if": "S16", "eq": "有"}}]}, {"id": "p2", "title": "不適部位與健身目標", "paper": "紙本第 2 頁", "blocks": [{"type": "head", "text": "目前不適之關節與部位", "who": "學員"}, {"id": "S19", "label": "目前有不舒服的關節或部位嗎？", "type": "radio", "opts": ["有", "沒有"], "req": true}, {"id": "S20", "label": "請點人形圖或在右邊勾選（可複選）", "type": "parts", "req": true, "show": {"if": "S19", "eq": "有"}}, {"id": "S21", "label": "最近彎腰或轉身時，背部會痛嗎？", "type": "radio", "opts": ["會", "不會"], "req": true, "cell": "C53"}, {"type": "head", "text": "健身目標及動機", "who": "學員"}, {"id": "S22", "label": "健身目標及動機", "type": "textarea", "req": true, "nolabel": true}, {"type": "head", "text": "課程進度規劃", "who": "教練"}, {"id": "K23", "label": "課程進度規劃", "type": "textarea", "nolabel": true}, {"id": "K24", "label": "32 堂課表版本", "type": "radio", "opts": ["A版", "B版", "不套用"], "cell": "C70", "suggest": true}, {"type": "head", "text": "簽名 ①", "who": "學員"}, {"id": "S23", "label": "學員簽名", "type": "sig", "req": true, "w": "half"}, {"id": "S24", "label": "日期", "type": "date", "req": true, "today": true, "w": "half"}, {"id": "S25", "label": "父母／監護人簽名", "type": "sig", "req": true, "minor": true, "w": "half"}]}, {"id": "p3", "title": "PAR-Q+ 身體活動準備問卷", "paper": "紙本第 3 頁", "blocks": [{"type": "head", "text": "一般健康問題（請回答是或否）", "who": "學員"}, {"id": "S26", "label": "1. 醫生曾經告知您有心血管相關狀況或是高血壓？", "type": "radio", "opts": ["是", "否"], "req": true, "cell": "C39"}, {"id": "S26a", "label": "請勾選", "type": "multi", "opts": ["心血管相關狀況", "高血壓"], "req": true, "show": {"if": "S26", "eq": "是"}, "cls": "q-sub"}, {"id": "S27", "label": "2. 曾在休息時、日常休閒活動或是運動中感覺到胸悶嗎？（如果是因為過度換氣引起或有關，包含在劇烈運動時暈眩請勾否）", "type": "radio", "opts": ["是", "否"], "req": true, "cell": "C40"}, {"id": "S28", "label": "3. 近一年內有過暈眩、失去平衡或是失去意識嗎？", "type": "radio", "opts": ["是", "否"], "req": true, "cell": "C41"}, {"id": "S29", "label": "是哪一種？（可複選）", "type": "multi", "opts": ["因頭暈而失去平衡", "失去意識"], "req": true, "show": {"if": "S28", "eq": "是"}, "cls": "q-sub"}, {"id": "S30", "label": "4. 曾經患有慢性疾病（心臟相關狀況跟高血壓除外）？", "type": "radio", "opts": ["是", "否"], "req": true}, {"id": "S30a", "label": "請填寫", "type": "text", "req": true, "show": {"if": "S30", "eq": "是"}, "cls": "q-sub"}, {"id": "S31", "label": "5. 目前有在服用慢性病的處方藥物嗎？", "type": "radio", "opts": ["是", "否"], "req": true}, {"id": "S31a", "label": "請填寫病症及藥物名稱", "type": "text", "req": true, "show": {"if": "S31", "eq": "是"}, "cls": "q-sub"}, {"id": "S32", "label": "6. 目前是否有（或過去 12 個月期間）骨骼、關節或軟組織（肌肉、肌腱、韌帶等）相關健康問題，可能會因為從事體能活動而惡化？（如果過去曾有相關的問題，但目前不會對你從事體能活動造成任何影響或限制請回答否）", "type": "radio", "opts": ["是", "否"], "req": true, "cell": "C42"}, {"id": "S33", "label": "7. 醫生是否曾告知只能在醫療人員的監督下做運動？", "type": "radio", "opts": ["是", "否"], "req": true}, {"type": "note", "text": "7 題都答「否」：不用填後面的追問，直接到「參與者聲明」。", "cls": "hint", "showNot": {"anyYes": ["S26", "S27", "S28", "S30", "S31", "S32", "S33"]}}]}, {"id": "p4", "title": "PAR-Q+ 追問", "paper": "紙本第 4–7 頁", "show": {"anyYes": ["S26", "S27", "S28", "S30", "S31", "S32", "S33"]}, "blocks": [{"type": "note", "text": "上一頁有任何一題答「是」，請回答以下問題。每一大題答「有」才需要回答小題。", "cls": "hint"}, {"id": "S34", "label": "1. 您有關節炎、骨質疏鬆症或是背部問題嗎？", "type": "radio", "opts": ["有", "沒有"], "req": true, "cls": "q-main"}, {"id": "S35", "label": "a. 您是否難以透過藥物或醫生處方控制病情？（如果目前沒有服用藥物或其他治療請勾「否」）", "type": "radio", "opts": ["是", "否"], "req": true, "show": {"if": "S34", "eq": "有"}, "cls": "q-sub"}, {"id": "S36", "label": "b. 是否有因關節問題引起的疼痛，包含近期發生的骨折、骨質疏鬆症引起的骨折或癌症，脊椎問題、椎骨位移（例如：椎間盤滑脫）或是椎弓骨折、椎弓解離等健康狀況？", "type": "radio", "opts": ["是", "否"], "req": true, "show": {"if": "S34", "eq": "有"}, "cls": "q-sub"}, {"id": "S37", "label": "c. 您是否定期注射類固醇或是服用類固醇藥物超過三個月？", "type": "radio", "opts": ["是", "否"], "req": true, "show": {"if": "S34", "eq": "有"}, "cls": "q-sub", "cell": "C44"}, {"id": "S38", "label": "2. 現在有任何種類的癌症嗎？", "type": "radio", "opts": ["有", "沒有"], "req": true, "cls": "q-main", "cell": "C45"}, {"id": "S39", "label": "a. 您是否包括以下任何類型的癌症：肺／支氣管癌、多發性骨髓瘤（漿細胞癌）、頭部和／或頸部？", "type": "radio", "opts": ["是", "否"], "req": true, "show": {"if": "S38", "eq": "有"}, "cls": "q-sub"}, {"id": "S40", "label": "b. 您目前是否正在接受癌症治療（例如化療或放療）？", "type": "radio", "opts": ["是", "否"], "req": true, "show": {"if": "S38", "eq": "有"}, "cls": "q-sub", "cell": "C45"}, {"id": "S41", "label": "3. 您有心臟或心血管疾病嗎？包括冠狀動脈疾病、心臟衰竭、心律不整", "type": "radio", "opts": ["有", "沒有"], "req": true, "cls": "q-main", "cell": "C46"}, {"id": "S42", "label": "a. 您是否難以透過藥物或醫生處方控制病情？（如果目前沒有服用藥物或其他治療請勾「否」）", "type": "radio", "opts": ["是", "否"], "req": true, "show": {"if": "S41", "eq": "有"}, "cls": "q-sub"}, {"id": "S43", "label": "b. 您是否有需要醫療介入的不規則心跳？如：心房顫動、室性早搏", "type": "radio", "opts": ["是", "否"], "req": true, "show": {"if": "S41", "eq": "有"}, "cls": "q-sub"}, {"id": "S44", "label": "c. 您是否有慢性的心臟衰竭？", "type": "radio", "opts": ["是", "否"], "req": true, "show": {"if": "S41", "eq": "有"}, "cls": "q-sub"}, {"id": "S45", "label": "d. 您是否已經確診冠狀動脈疾病，並且在過去兩個月內沒有規律的運動？", "type": "radio", "opts": ["是", "否"], "req": true, "show": {"if": "S41", "eq": "有"}, "cls": "q-sub"}, {"id": "S46", "label": "4. 您現在有高血壓嗎？",   ['S23', 'S79', 'K25'].forEach(id => { const s = sigs[id]; if (!s) return; if (!s.ctx) s.restore(); if (!s.ctx) return; const c = s.canvas, w = c.getBoundingClientRect().width; s.ctx.beginPath(); s.ctx.moveTo(30, 100); for (let x = 30; x < w * 0.6; x += 12) s.ctx.lineTo(x, 70 + Math.sin(x / 9) * 25); s.ctx.stroke(); s.dirty = true; s.data = c.toDataURL('image/png'); });
  refresh();
}

/* ---------- 送出：PDF → Drive，再寫一列進 Sheet ---------- */
let mcpP = null;
function getMcp(){ if (!(window.claude && window.claude.use)) return Promise.resolve(null); if (!mcpP) mcpP = window.claude.use('mcp').catch(() => null); return mcpP; }
function errText(e){
  const c = e && e.code;
  const m = {needs_reauth: '連線過期：請到 claude.ai 設定 → Connectors 重新連結 ' + (e.server || ''),
    server_not_connected: '還沒連結 ' + (e.server || '這個服務') + '：請到 claude.ai 設定 → Connectors 加入',
    not_in_manifest: '這個頁面沒有被允許使用 ' + (e.server || '這個服務') + '（可能按了不允許）',
    approval_required: '需要你在 claude.ai 按「允許」才能寫入', blocked_by_policy: '組織政策不允許這個動作',
    server_unavailable: '服務暫時連不上，可能沒寫入也可能已寫入，請先到 Sheet 確認再重送',
    upstream_error: '連線出錯，可能沒寫入也可能已寫入，請先到 Sheet 確認再重送',
    tool_error: '對方回報錯誤：' + (e.message || '')};
  return m[c] || ('錯誤（' + (c || '未知') + '）：' + (e && e.message || e));
}
async function makePdf(){
  document.body.classList.add('printing');
  try {
    const {jsPDF} = window.jspdf; let pdf = null;
    const pages = [...document.querySelectorAll('.page')].filter(p => !p.classList.contains('off'));
    for (const pg of pages) {
      const cv = await html2canvas(pg, {scale: 1.15, backgroundColor: '#ffffff', useCORS: true, ignoreElements: e => e.classList?.contains('noprint')});
      const w = 210, h = w * cv.height / cv.width; const img = cv.toDataURL('image/jpeg', 0.6);
      if (!pdf) pdf = new jsPDF({unit: 'mm', format: [w, h], orientation: h > w ? 'p' : 'l'}); else pdf.addPage([w, h], h > w ? 'p' : 'l');
      pdf.addImage(img, 'JPEG', 0, 0, w, h);
    }
    return pdf.output('blob');
  } finally { document.body.classList.remove('printing'); render(); }
}
/* ---------- 體驗課分頁對照（題目 → 公版課表格子） ---------- */
// v27 起：C41 填「失去平衡／失去意識／兩者／是（沒勾哪一種）」；C57 只算 12 個月內的手術；C58 通用 7；C32 可填「沒做過」
function g3cell(){
  if (!fieldOn(BYID.S28) || val('S28') !== '是') return '';
  const ab = st.S29 || [];
  const a = ab.includes('因頭暈而失去平衡'), b = ab.includes('失去意識');
  return a && b ? '兩者' : a ? '失去平衡' : b ? '失去意識' : '是（沒勾哪一種）';
}
function surgery12m(){
  if (!fieldOn(BYID.S15)) return false;
  const fd = new Date(st.K03 || today()); const fm = fd.getFullYear() * 12 + fd.getMonth() + 1;
  return (st.S15 || []).some(r => { if (r.cat !== '手術' || !r.ym) return false;
    const m = String(r.ym).match(/(\d{4})\D+(\d{1,2})/); if (!m) return false;
    return fm - (+m[1] * 12 + +m[2]) <= 12; });
}
function courseBlocks(){
  const on = id => fieldOn(BYID[id]) ? val(id) : '';
  const num = id => { const v = on(id); return v === '' || isNaN(+v) ? '' : +v; };
  const V = b => b ? 'V' : '';
  const dd = dobCalc(st.S03);
  const S09 = st.S09 || [];
  const blocks = [
    ['體驗課!C7:C10', [on('K02'), on('S01'), on('S02'), dd.year && dd.m && dd.d ? `${dd.year}/${dd.m}/${dd.d}` : '']],
    ['體驗課!C13:C14', [num('K07'), num('K08')]],
    ['體驗課!C16:C21', [num('K11'), num('K10'), num('K09'), num('K05'), num('K06'), num('K04')]],
    ['體驗課!C30:C34', [num('K12'), num('K13'), on('S16') === '沒做過' ? '沒做過' : num('S17'), num('S18'), on('K22') === '靠不到' ? 1 : on('K22') === '靠得到' ? 0 : '']],
    ['體驗課!C39:C51', [V(on('S26') === '是'), V(on('S27') === '是'), g3cell(), V(on('S32') === '是'),
      V(on('S13') === '有'), V(on('S12') === '是' || on('S37') === '是'), V(on('S38') === '有'), V(on('S41') === '有'),
      V(on('S46') === '有' || on('S48') === '是'), V(on('S51') === '是' || on('S65') === '是'), V(on('S67') === '有'),
      V(on('S69') === '是'), V(on('S70') === '是')]],
    ['體驗課!C53:C57', [V(on('S21') === '會'), V(/^\((一|二)\)/.test(on('S08'))),
      V(['帕金森氏症', '失智症', '小腦疾病', '前庭疾病／眩暈症', '視力障礙'].some(x => S09.includes(x))),
      V(on('S41') === '有'), V(surgery12m())]],  // C56 改看 S41（11/10 宇劭定）
    ['體驗課!C58', [on('S33') === '是' ? '通用7：醫師說要在醫療人員監督下運動' : '']],
  ];
  if (!(dd.m && dd.d) && dd.age != null) blocks.push(['體驗課!C11', [dd.age]]); // 沒生日：年齡直接填
  if (on('K24')) blocks.push(['體驗課!C70', [on('K24')]]);
  return blocks.map(([range, col]) => ({range, values: col.map(x => [x])}));
}
async function makeCourse(mcp){
  const store = val('K01'), folder = STORE_FOLDER[store];
  const title = `${val('K03') || today()}_${val('S01')}_公版課表`.replace(/[\\/:*?"<>|]/g, '_');
  const res = await mcp.callTool('Google Drive', 'copy_file', {fileId: TEMPLATE_ID, parentId: folder, title});
  const p = res.payload || {}; if (!p.id) throw {code: 'tool_error', message: '複製課表沒拿到檔案 ID'};
  for (const b of courseBlocks()) await mcp.callTool('Google Sheets', 'update_values', {spreadsheetId: p.id, range: b.range, values: b.values});
  return {id: p.id, url: 'https://docs.google.com/spreadsheets/d/' + p.id + '/edit', title, store};
}

let busy = false;
async function submit(){
  if (busy) return;
  const miss = refresh();
  if (miss.length) {
    showModal(el('h3', {}, `還有 ${miss.length} 個必填沒填`), el('ul', {}, miss.slice(0, 12).map(f => el('li', {}, `${f._page.title}｜${f.label}`))), miss.length > 12 ? el('div', {class: 'age'}, `……還有 ${miss.length - 12} 項`) : '',
      el('div', {style: 'display:flex;gap:10px;justify-content:flex-end;margin-top:16px'}, el('button', {class: 'btn', onclick: closeModal}, '關閉'), el('button', {class: 'btn pri', onclick: () => { closeModal(); gotoMissing(); }}, '帶我去第一個')));
    return;
  }
  busy = true; document.getElementById('bSubmit').disabled = true;
  const li = {}; const steps = el('ul', {class: 'steps'});
  ['pdf', 'drive', 'course', 'sheet'].forEach(k => { li[k] = el('li', {}); steps.append(li[k]); });
  const mark = (k, cls, t) => { li[k].innerHTML = ''; li[k].append(el('span', {class: cls}, cls === 'ok' ? '✓ ' : cls === 'bad' ? '✕ ' : '… '), t); };
  const closeBtn = el('button', {class: 'btn pri', onclick: closeModal}, '關閉'); closeBtn.disabled = true;
  showModal(el('h3', {}, '送出中'), steps, el('div', {style: 'text-align:right;margin-top:14px'}, closeBtn));
  mark('pdf', 'run', '產生仿紙本 PDF'); mark('drive', 'run', '存 PDF 到 Drive'); mark('course', 'run', '開公版課表、填好體驗課分頁'); mark('sheet', 'run', '寫進體驗課總表');
  const now = new Date(); const stamp = now.toLocaleString('zh-TW', {hour12: false});
  const mcp = await getMcp();
  let pdfLink = '';
  try {
    const blob = await makePdf(); mark('pdf', 'ok', `PDF 產生完成（${(blob.size / 1024).toFixed(0)} KB）`);
    if (!mcp) { mark('drive', 'bad', '這個畫面不能連 Google（請在 claude.ai 打開本頁）'); pdfLink = '未存（無連線）'; }
    else {
      try {
        const name = `${val('K03') || today()}_${val('K01')}_${val('S01')}_體驗課表單.pdf`.replace(/[\\/:*?"<>|]/g, '_');
        const lt = await mcp.listTools().catch(() => ({}));
        const content = lt.fileArgs ? {$file: {data: blob, name, type: 'application/pdf'}} : await new Promise(r => { const fr = new FileReader(); fr.onload = () => r(fr.result.split(',')[1]); fr.readAsDataURL(blob); });
        const res = await mcp.callTool('Google Drive', 'create_file', {title: name, parentId: PDF_FOLDER, contentMimeType: 'application/pdf', disableConversionToGoogleType: true, base64Content: content});
        const p = res.payload || {}; pdfLink = p.viewUrl || (p.id ? 'https://drive.google.com/file/d/' + p.id + '/view' : '已存（沒拿到連結）');
        mark('drive', 'ok', '已存到 Drive「體驗課表單PDF（試用）」');
      } catch (e) { mark('drive', 'bad', 'PDF 沒存到 Drive：' + errText(e)); pdfLink = 'PDF 未存：' + (e.code || ''); }
    }
  } catch (e) { mark('pdf', 'bad', 'PDF 產生失敗：' + (e.message || e)); mark('drive', 'bad', '略過'); pdfLink = 'PDF 產生失敗'; }

  let courseLink = '', course = null;
  if (!mcp) { mark('course', 'bad', '這個畫面不能連 Google'); courseLink = '未開（無連線）'; }
  else {
    try { course = await makeCourse(mcp); courseLink = course.url; mark('course', 'ok', `已開課表「${course.title}」，放在 ${course.store} 資料夾`); }
    catch (e) { mark('course', 'bad', '課表沒開成：' + errText(e) + '（可能已複製但沒填完，請到該店資料夾確認）'); courseLink = '課表未完成：' + (e.code || ''); }
  }
  const row = [stamp, VERSION, ...FIELDS.map(f => { if (!fieldOn(f)) return ''; if (f.type === 'sig') return sigImage(f.id); return val(f.id); }), age() ?? '', pdfLink, courseLink];
  if (!mcp) { mark('sheet', 'bad', '這個畫面不能連 Google，資料沒寫入（請在 claude.ai 打開本頁）'); }
  else {
    try {
      await mcp.callTool('Google Sheets', 'append_values', {spreadsheetId: SHEET_ID, range: SHEET_RANGE, values: [row]});
      mark('sheet', 'ok', '已寫進「體驗課總表（試用）」，共 ' + row.length + ' 欄');
      mbox.querySelector('h3').textContent = '送出完成';
      mbox.append(el('div', {class: 'age', style: 'margin-top:8px;display:flex;gap:18px;flex-wrap:wrap'},
        course ? el('a', {href: course.url, target: '_blank'}, '打開這位學員的公版課表') : '',
        el('a', {href: 'https://docs.google.com/spreadsheets/d/' + SHEET_ID + '/edit', target: '_blank'}, '打開體驗課總表（試用）')));
    } catch (e) { mark('sheet', 'bad', '沒寫進 Sheet：' + errText(e)); mbox.querySelector('h3').textContent = '送出沒有完成'; }
  }
  closeBtn.disabled = false; busy = false; document.getElementById('bSubmit').disabled = false;
}

function init(){ FIELDS.forEach(f => { if (f.today && !st[f.id]) st[f.id] = today(); }); render(); }
init();
getMcp();
let rt; window.addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(() => Object.values(sigs).forEach(s => s.restore && s.restore()), 200); });
</script>
